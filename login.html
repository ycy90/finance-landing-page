<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EP LOGIN</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/icons/coins.svg?v=12345"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="./md.css"
      media="all and (min-width: 620px) and (max-width: 1023.98px)"
    />

    <link
      rel="stylesheet"
      href="./lg.css"
      media="all and (min-width: 1024px)"
    />
  </head>

  <body>
    <main>
      <nav></nav>
      <section>
        <form class="login__container" name="login" method="POST" netlify>
             <div class="login__info">
              <label for="login-email">Email Address </label>
              <input
                id="login-email"
                name="login-email"
                type="email"
                placeholder="e.g john.doe@gmail.com"
                required
                autocomplete="email"
              />
            </div>
             <div class="login__info">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
              />
            </div>
            <p class="login__forget">Forgot your password? Click <a href="./login.html">here</a></p>
            <div class="login__buttons">
            <button class="btn btn--primary" type="submit">Login</button>
            <button class="btn btn--primary" type="reset">Reset</button>
            </div>
            
        </form>
      </section>
    </main>

     <a class="scroll" href="./index.html" aria-label="Back to Homepage"
      ><img src="./assets/icons/arrow-left.svg" alt=""
    /></a>
  </body>
